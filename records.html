<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Records</title>
  <style>
    body {
      display: flex;
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #f4f9f6;
    }
    .sidebar {
      width: 250px;
      background-color: #123d37;
      color: white;
      height: 100vh;
      padding: 20px;
    }
    .sidebar h3 {
      margin-top: 0;
    }
    .sidebar a {
      display: block;
      color: white;
      text-decoration: none;
      margin: 15px 0;
    }
    .main-content {
      flex: 1;
      padding: 40px;
    }
    .main-content h2 {
      margin-bottom: 20px;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 20px;
    }
    .controls input, .controls select {
      padding: 10px;
      border-radius: 5px;
      border: 1px solid #ccc;
    }
    .add-record-btn {
      padding: 10px 20px;
      background-color: #1abc9c;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background-color: white;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.05);
    }
    th, td {
      padding: 12px;
      border: 1px solid #ddd;
      text-align: left;
    }
    th {
      background-color: #1abc9c;
      color: white;
    }
    .action-btns button {
      padding: 5px 10px;
      margin-right: 5px;
      border: none;
      border-radius: 3px;
      cursor: pointer;
    }
    .delete-btn { background-color: #e74c3c; color: white; }
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.5);
      justify-content: center;
      align-items: center;
      z-index: 999;
    }
    .modal-content {
      background: white;
      padding: 20px;
      border-radius: 8px;
      width: 300px;
    }
    .modal-content input, .modal-content textarea {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
      margin-bottom: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    @media (max-width: 768px) {
      .sidebar { display: none; }
      .main-content { padding: 20px; }
    }
  </style>
</head>
<body>
  <div class="sidebar">
    <h3>User Menu</h3>
    <a href="#">Dashboard</a>
    <a href="#">View Profile</a>
    <a href="#">Edit Profile</a>
    <a href="#">Records</a>
    <a href="#">Farmer Reports</a>
    <a href="#">Market-info</a>
    <a href="#">FAQs & Expert Responses</a>
    <a href="#">Success stories</a>
    <a href="#">Logout</a>
  </div>

  <div class="main-content">
    <h2>My Farm Records</h2>
    <div class="controls">
      <input type="text" id="searchInput" placeholder="Search summary..." />
      <select id="filterType">
        <option value="">All Types</option>
        <option value="Crop Yield">Crop Yield</option>
        <option value="Livestock Sales">Livestock Sales</option>
      </select>
      <button class="add-record-btn" onclick="openModal()">+ Add Record</button>
    </div>
    <table>
      <thead>
        <tr>
          <th>Type</th>
          <th>Date</th>
          <th>Summary</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="recordTable"></tbody>
    </table>
  </div>

  <div class="modal" id="recordModal">
    <div class="modal-content">
      <h3>Add Record</h3>
      <label>Type</label>
      <input type="text" id="recordType" placeholder="e.g. Crop Yield" />
      <label>Date</label>
      <input type="date" id="recordDate" />
      <label>Summary</label>
      <textarea id="recordSummary" rows="3" placeholder="Summary details..."></textarea>
      <button onclick="addRecord()">Save</button>
      <button onclick="closeModal()">Cancel</button>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDoJnrBj36VbxxlP_UW0Fqg4kHSQehlKmk",
      authDomain: "agri-digi.firebaseapp.com",
      projectId: "agri-digi",
      storageBucket: "agri-digi.appspot.com",
      messagingSenderId: "75045066424",
      appId: "1:75045066424:web:2f811fdd1347020fc4064d",
      measurementId: "G-PV6WEHB1FV"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    let currentUser;

    const recordTable = document.getElementById("recordTable");
    const searchInput = document.getElementById("searchInput");
    const filterType = document.getElementById("filterType");

    function openModal() {
      document.getElementById("recordModal").style.display = "flex";
    }

    function closeModal() {
      document.getElementById("recordModal").style.display = "none";
      document.getElementById("recordType").value = "";
      document.getElementById("recordDate").value = "";
      document.getElementById("recordSummary").value = "";
    }

    async function fetchRecords() {
      const snapshot = await db.collection("records").doc(currentUser.uid).collection("items").orderBy("date", "desc").get();
      let html = "";
      snapshot.forEach(doc => {
        const d = doc.data();
        const matchSummary = d.summary?.toLowerCase().includes(searchInput.value.toLowerCase());
        const matchType = !filterType.value || d.type === filterType.value;
        if (matchSummary && matchType) {
          html += `
            <tr>
              <td>${d.type}</td>
              <td>${d.date}</td>
              <td>${d.summary}</td>
              <td class="action-btns">
                <button class="delete-btn" onclick="deleteRecord('${doc.id}')">Delete</button>
              </td>
            </tr>
          `;
        }
      });
      recordTable.innerHTML = html;
    }

    async function addRecord() {
      const type = document.getElementById("recordType").value.trim();
      const date = document.getElementById("recordDate").value;
      const summary = document.getElementById("recordSummary").value.trim();

      if (!type || !date || !summary) {
        alert("Please fill all fields.");
        return;
      }

      try {
        await db.collection("records").doc(currentUser.uid).collection("items").add({
          type,
          date,
          summary,
          userId: currentUser.uid
        });
        closeModal();
        fetchRecords();
        alert("Record added successfully.");
      } catch (error) {
        alert("Error adding record: " + error.message);
      }
    }

    async function deleteRecord(id) {
      if (confirm("Are you sure you want to delete this record?")) {
        try {
          await db.collection("records").doc(currentUser.uid).collection("items").doc(id).delete();
          fetchRecords();
        } catch (error) {
          alert("Failed to delete record: " + error.message);
        }
      }
    }

    searchInput.addEventListener("input", fetchRecords);
    filterType.addEventListener("change", fetchRecords);

    auth.onAuthStateChanged(user => {
      if (user) {
        currentUser = user;
        fetchRecords();
      } else {
        alert("Please sign in to view your records.");
        window.location.href = "login.html";
      }
    });
  </script>
</body>
</html>
