<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Records</title>
  <link rel="stylesheet" href="profile.css">

  <style>
    .main {
      margin-left: 260px;
      padding: 10px;
      display: flex;
      flex-direction: column;
    }

    .menu-toggle {
      position: fixed;
      top: 5px;
      left: 10px;
      font-size: 24px;
      cursor: pointer;
      z-index: 1000;
      display: none;
    }

    .sidebar {
      width: 250px;
      background-color: #123d37;
      color: white;
      height: 100vh;
      position: fixed;
      top: 0;
      left: 0;
      padding: 20px;
    }

    .sidebar h2 {
      margin-top: 0;
    }

    .sidebar a {
      display: block;
      color: white;
      text-decoration: none;
      margin: 15px 0;
    }

    .record-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      margin-top: -30px;
    }

    .record-header h2 {
      margin: 0;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 20px;
    }

    .controls input, .controls select, .add-record-btn {
      padding: 10px;
      border-radius: 5px;
      border: 1px solid #ccc;
    }

    .add-record-btn {
      background-color: #1abc9c;
      color: white;
      cursor: pointer;
      border: none;
      margin-left: 200px;
    }
    .record-table{
      margin-right: 900px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background-color: white;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.05);
      margin-top: 20px;
      margin-right: 100px;
      
    }

    th, td {
      padding: 12px;
      border: 1px solid #ddd;
      text-align: left;
    }

    th {
      background-color: #1abc9c;
      color: white;
    }

    .action-btns button {
      padding: 5px 10px;
      margin-right: 5px;
      border: none;
      border-radius: 3px;
      cursor: pointer;
    }

    .delete-btn {
      background-color: #e74c3c;
      color: white;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.5);
      justify-content: center;
      align-items: center;
      z-index: 999;
    }

    .modal-content {
      background: white;
      padding: 20px;
      border-radius: 8px;
      width: 300px;
    }

    .modal-content input, .modal-content textarea {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
      margin-bottom: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    @media (max-width: 768px) {
      .sidebar {
        display: none;
      }
      .menu-toggle {
        display: flex;
      }
      .main {
        margin-left: 0;
        padding: 20px;
      }
      
    }
  </style>
</head>
<body>
  <div class="menu-toggle" onclick="toggleSidebar()">☰</div>
  <div class="sidebar" id="sidebar">
    <h2>User Menu</h2>
    <a href="profile.html">Home</a>
    <a href="view-profile.html">View Profile</a>
    <a href="#">Edit Profile</a>
    <a href="records.html">Records</a>
    <a href="#">Farmer reports</a>
    <a href="market.html">Market-info</a>
    <a href="#">FAQs & Expert Responses</a>
    <a href="#">Success stories.</a>
    <a href="login.html">Logout</a>
  </div>

  <div class="main">
    <div class="record-header">
      <h2>My Farm Records</h2>
    </div>
    <div class="controls">
      <input type="text" id="searchInput" placeholder="Search summary..." />
      <select id="filterType">
        <option value="">All Types</option>
        <option value="Crop Yield">Crop Yield</option>
        <option value="Livestock Sales">Livestock Sales</option>
      </select>
      <button class="add-record-btn" onclick="downloadSpreadsheet()">⬇ Download Spreadsheet</button>
      <button class="add-record-btn" onclick="openModal()">+ Add Record</button>
    </div>
    <table class="record-table">
      <thead>
        <tr>
          <th>Type</th>
          <th>Date</th>
          <th>Summary</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="recordTable"></tbody>
    </table>
  </div>

  <div class="modal" id="recordModal">
    <div class="modal-content">
      <h3>Add Record</h3>
      <label>Type</label>
      <input type="text" id="recordType" placeholder="e.g. Crop Yield" />
      <label>Date</label>
      <input type="date" id="recordDate" />
      <label>Summary</label>
      <textarea id="recordSummary" rows="3" placeholder="Summary details..."></textarea>
      <button onclick="addRecord()">Save</button>
      <button onclick="closeModal()">Cancel</button>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore-compat.js"></script>
  <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDoJnrBj36VbxxlP_UW0Fqg4kHSQehlKmk",
      authDomain: "agri-digi.firebaseapp.com",
      projectId: "agri-digi",
      storageBucket: "agri-digi.appspot.com",
      messagingSenderId: "75045066424",
      appId: "1:75045066424:web:2f811fdd1347020fc4064d",
      measurementId: "G-PV6WEHB1FV"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    let currentUser;

    const recordTable = document.getElementById("recordTable");
    const searchInput = document.getElementById("searchInput");
    const filterType = document.getElementById("filterType");

    function toggleSidebar() {
      document.getElementById("sidebar").classList.toggle("active");
    }

    function openModal() {
      document.getElementById("recordModal").style.display = "flex";
    }

    function closeModal() {
      document.getElementById("recordModal").style.display = "none";
      document.getElementById("recordType").value = "";
      document.getElementById("recordDate").value = "";
      document.getElementById("recordSummary").value = "";
    }

    async function fetchRecords() {
      const snapshot = await db.collection("records").doc(currentUser.uid).collection("items").orderBy("date", "desc").get();
      let html = "";
      snapshot.forEach(doc => {
        const d = doc.data();
        const matchSummary = d.summary?.toLowerCase().includes(searchInput.value.toLowerCase());
        const matchType = !filterType.value || d.type === filterType.value;
        if (matchSummary && matchType) {
          html += `
            <tr>
              <td>${d.type}</td>
              <td>${d.date}</td>
              <td>${d.summary}</td>
              <td class="action-btns">
                <button class="delete-btn" onclick="deleteRecord('${doc.id}')">Delete</button>
              </td>
            </tr>
          `;
        }
      });
      recordTable.innerHTML = html;
    }

    async function addRecord() {
      const type = document.getElementById("recordType").value.trim();
      const date = document.getElementById("recordDate").value;
      const summary = document.getElementById("recordSummary").value.trim();

      if (!type || !date || !summary) {
        alert("Please fill all fields.");
        return;
      }

      try {
        await db.collection("records").doc(currentUser.uid).collection("items").add({
          type,
          date,
          summary,
          userId: currentUser.uid
        });
        closeModal();
        fetchRecords();
        alert("Record added successfully.");
      } catch (error) {
        alert("Error adding record: " + error.message);
      }
    }

    async function deleteRecord(id) {
      if (confirm("Are you sure you want to delete this record?")) {
        try {
          await db.collection("records").doc(currentUser.uid).collection("items").doc(id).delete();
          fetchRecords();
        } catch (error) {
          alert("Failed to delete record: " + error.message);
        }
      }
    }

    searchInput.addEventListener("input", fetchRecords);
    filterType.addEventListener("change", fetchRecords);

    auth.onAuthStateChanged(user => {
      if (user) {
        currentUser = user;
        fetchRecords();
      } else {
        alert("Please sign in to view your records.");
        window.location.href = "login.html";
      }
    });

    async function downloadSpreadsheet() {
  try {
    const snapshot = await db.collection("records")
      .doc(currentUser.uid)
      .collection("items")
      .orderBy("date", "desc")
      .get();

    const data = [];
    snapshot.forEach(doc => {
      const d = doc.data();
      const matchSummary = d.summary?.toLowerCase().includes(searchInput.value.toLowerCase());
      const matchType = !filterType.value || d.type === filterType.value;
      if (matchSummary && matchType) {
        data.push({
          Type: d.type,
          Date: d.date,
          Summary: d.summary
        });
      }
    });

    if (data.length === 0) {
      alert("No records to export based on your current filter/search.");
      return;
    }

    const worksheet = XLSX.utils.json_to_sheet(data);
    const workbook = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(workbook, worksheet, "Farm Records");

    XLSX.writeFile(workbook, "Farm_Records.xlsx");
  } catch (error) {
    console.error("Error exporting spreadsheet:", error);
    alert("Failed to download spreadsheet.");
  }
}

  </script>
</body>
</html>
