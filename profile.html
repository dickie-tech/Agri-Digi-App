<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile Setup</title>
  <link rel="stylesheet" href="profile.css">
</head>
<body>
  <!-- Menu Toggle Button -->
  <div class="menu-toggle" onclick="toggleSidebar()">☰</div>

  <!-- Sidebar -->
  <div class="sidebar" id="sidebar">
    <h2>User Menu</h2>
    <a href="#">Dashboard</a>
    <a href="#">View Profile</a>
    <a href="#">Edit Profile</a>
    <a href="#">Settings</a>
    <a href="login.html">Logout</a>
  </div>

  <!-- Main Content -->
  <div class="main">
    <div class="profile-setup">
      <div class="progressbar">
        <div class="step-tab" onclick="goToStep(0)">1</div>
        <div class="step-tab" onclick="goToStep(1)">2</div>
        <div class="step-tab" onclick="goToStep(2)">3</div>
        <div class="step-tab" onclick="goToStep(3)">4</div>
      </div>

      <form id="profileForm">
        <!-- Step 1 -->
        <div class="step active">
          <h2>Step 1: Personal Info</h2>
          <input type="text" placeholder="Full Name" required>
          <input type="date" placeholder="Date of Birth" required>
          <button type="button" onclick="nextStep()">Next</button>
        </div>

        <!-- Step 2 -->
        <div class="step">
          <h2>Step 2: Contact Info</h2>
          <input type="email" placeholder="Email" required>
          <input type="tel" placeholder="Phone Number" required>
          <button type="button" onclick="prevStep()">Back</button>
          <button type="button" onclick="nextStep()">Next</button>
        </div>

        <!-- Step 3 -->
        <div class="step">
          <h2>Step 3: Address</h2>
          <input type="text" placeholder="County" required>
          <input type="text" placeholder="Town/City" required>
          <button type="button" onclick="prevStep()">Back</button>
          <button type="button" onclick="nextStep()">Next</button>
        </div>

        <!-- Step 4 -->
        <div class="step">
          <h2>Step 4: Preferences</h2>
          <select required>
            <option value="">Select Interest</option>
            <option value="livestock">Livestock</option>
            <option value="crop">Crop Farming</option>
            <option value="both">Both</option>
          </select>
          <button type="button" onclick="prevStep()">Back</button>
          <button type="submit">Finish</button>
        </div>
      </form>
    </div>
  </div>

  <script src="scripts/profile.js"></script>
  <script>
    function toggleSidebar() {
      document.getElementById("sidebar").classList.toggle("active");
    }
  </script>
</body>
</html>
