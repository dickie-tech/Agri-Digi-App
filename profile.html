<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Profile Setup</title>
  <link rel="stylesheet" href="profile.css">
  
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDoJnrBj36VbxxlP_UW0Fqg4kHSQehlKmk",
      authDomain: "agri-digi.firebaseapp.com",
      projectId: "agri-digi",
      storageBucket: "agri-digi.appspot.com",
      messagingSenderId: "75045066424",
      appId: "1:75045066424:web:2f811fdd1347020fc4064d",
      measurementId: "G-PV6WEHB1FV"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
  </script>

  <link rel="icon" href="images/icons8-profile-24.png" type="image/png">
</head>
<body>

  <!-- Sidebar Toggle -->
  <div class="menu-toggle" onclick="toggleSidebar()">☰</div>

  <!-- Sidebar -->
  <div class="sidebar" id="sidebar">
    <h2>User Menu</h2>
    <a href="#">Dashboard</a>
    <a href="view-profile.html">View Profile</a>
    <a href="#">Edit Profile</a>
    <a href="records.html">Records</a>
    <a href="reports.html">Farmer reports</a>
    <a href="market.html">Market-info</a>
    <a href="#">FAQs & Expert Responses</a>
    <a href="#">Success stories.</a>
    <a href="login.html">Logout</a>
  </div>

  <!-- Main Content -->
  <div class="main">
    <div class="profile-setup">
      <div class="progressbar">
        <div class="step-tab" onclick="goToStep(0)">1</div>
        <div class="step-tab" onclick="goToStep(1)">2</div>
        <div class="step-tab" onclick="goToStep(2)">3</div>
        <div class="step-tab" onclick="goToStep(3)">4</div>
      </div>

      <form id="profileForm">
        <!-- Step 1 -->
        <div class="step active">
          <h2>Step 1: Personal Info</h2>
          <input type="text" name="firstName" placeholder="First Name" required>
          <input type="text" name="lastName" placeholder="Last Name" required>
          <input type="date" name="dob" placeholder="Date of Birth" required>
          <input type="email" name="email" placeholder="Email" required>
          <input type="tel" name="idNo" placeholder="ID No." required>
          <select name="gender" required>
            <option value="">Gender</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
            <option value="Prefer not say">Prefer not say</option>
          </select>
          <select name="maritalStatus" required>
            <option value="">Marital Status</option>
            <option value="Single">Single</option>
            <option value="Married">Married</option>
          </select>
          <input type="tel" name="phone" placeholder="Phone Number" required>
          <button type="button" onclick="nextStep()">Next</button>
        </div>

        <!-- Step 2 -->
        <div class="step">
          <h2>Step 2: Location Info</h2>
          <input type="text" name="boxNo" placeholder="Box No#" required>
          <input type="text" name="postalCode" placeholder="Postal code" required>
          <input type="text" name="county" placeholder="County" required>
          <input type="text" name="town" placeholder="Town/city" required>
          <input type="text" name="constituency" placeholder="Constituency" required>
          <input type="text" name="ward" placeholder="Ward" required>
          <button type="button" onclick="prevStep()">Back</button>
          <button type="button" onclick="nextStep()">Next</button>
        </div>

        <!-- Step 3 -->
        <div class="step">
          <h2>Step 3: Preferences</h2>
          <select name="role" required>
            <option value="">User Role</option>
            <option value="Farmer">Farmer</option>
            <option value="Buyer">Buyer</option>
            <option value="Extension Officer">Extension Officer</option>
          </select>
          <select name="interest" required>
            <option value="">Select Interest</option>
            <option value="livestock">Livestock</option>
            <option value="crop">Crop Farming</option>
            <option value="both">Both</option>
          </select>
          <button type="button" onclick="prevStep()">Back</button>
          <button type="button" onclick="nextStep()">Next</button>
        </div>

        <!-- Step 4 -->
        <div class="step">
          <h2>Step 4: Username</h2>
          <input type="text" name="username" placeholder="Username" required>

          <!-- Profile picture section commented out to avoid 'files' error -->
          <!--
          <label for="profilePicture" style="margin-top: 15px; display: block;">Upload Profile Picture:</label>
          <input 
            type="file" 
            id="profilePicture" 
            name="profilePicture" 
            accept="image/*" 
            onchange="previewImage(event)"
          />
          <div style="margin-top: 10px;">
            <img id="imagePreview" src="#" alt="Profile Preview" style="display:none; max-width: 150px; max-height: 150px; border-radius: 50%; object-fit: cover;"/>
          </div>
          -->

          <button type="button" onclick="prevStep()">Back</button>
          <button type="submit">Finish</button>
        </div>

      </form>
    </div>
  </div>

  <script>
    function toggleSidebar() {
      document.getElementById("sidebar").classList.toggle("active");
    }

    function goToStep(stepIndex) {
      const steps = document.querySelectorAll(".step");
      steps.forEach((step, i) => {
        step.classList.toggle("active", i === stepIndex);
      });
    }

    function nextStep() {
      const current = document.querySelector(".step.active");
      const next = current.nextElementSibling;
      if (next && next.classList.contains("step")) {
        current.classList.remove("active");
        next.classList.add("active");
      }
    }

    function prevStep() {
      const current = document.querySelector(".step.active");
      const prev = current.previousElementSibling;
      if (prev && prev.classList.contains("step")) {
        current.classList.remove("active");
        prev.classList.add("active");
      }
    }

    // Save profile to Firestore
    document.getElementById("profileForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const form = e.target;

      const userData = {
        firstName: form.firstName.value,
        lastName: form.lastName.value,
        dob: form.dob.value,
        email: form.email.value,
        idNo: form.idNo.value,
        gender: form.gender.value,
        maritalStatus: form.maritalStatus.value,
        phone: form.phone.value,
        boxNo: form.boxNo.value,
        postalCode: form.postalCode.value,
        county: form.county.value,
        town: form.town.value,
        constituency: form.constituency.value,
        ward: form.ward.value,
        role: form.role.value,
        interest: form.interest.value,
        username: form.username.value,
        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      };

      try {
        const user = auth.currentUser;
        if (!user) {
          alert("You must be logged in to complete profile setup.");
          return;
        }

        await db.collection("profiles").doc(user.uid).set(userData);

        alert("Profile saved successfully!");
        window.location.href = "view-profile.html"; // redirect after save
      } catch (error) {
        console.error("Error saving profile:", error);
        alert("Error: " + error.message);
      }
    });
  </script>
</body>
</html>
